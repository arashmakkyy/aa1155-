name: Build Void

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout void source
        uses: actions/checkout@v4
        with:
          repository: voideditor/void   # یا fork خودت
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm i

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: void-node-modules
          path: node_modules/
          retention-days: 3
