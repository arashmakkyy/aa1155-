name: Build Void

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout void source
        uses: actions/checkout@v4
        with:
          repository: voideditor/void
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm i

      - name: Compile
        run: npm run compile

      - name: Upload compiled output
        uses: actions/upload-artifact@v4
        with:
          name: void-compiled
          path: |
            out/
            extensions/
          retention-days: 3
